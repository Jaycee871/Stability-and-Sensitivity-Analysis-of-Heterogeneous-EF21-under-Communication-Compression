name: research-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Grid smoke test
        run: python scripts/run_grid.py --tau-points 10 --epsilon-points 10 --output /tmp/stability_grid.csv
      - name: Phase 2 landscape smoke test
        run: >-
          python scripts/analyze_phase2.py
          --tau-points 12
          --epsilon-points 11
          --output-dir /tmp/phase2
          --figure-dir /tmp/phase2-figures
      - name: Phase 3 guideline smoke test
        run: >-
          python scripts/analyze_phase3.py
          --tau-points 31
          --epsilon-points 31
          --output-dir /tmp/phase3
          --figure-dir /tmp/phase3-figures
      - name: Phase 4 robustness smoke test
        run: >-
          python scripts/analyze_phase4.py
          --pairs 200
          --output /tmp/phase4-summary.json
      - name: Phase 11 full heterogeneity smoke test
        run: >-
          python scripts/analyze_phase11.py
          --tau-l-points 7
          --tau-mu-points 7
          --epsilon-points 7
          --output-dir /tmp/phase11
      - name: Phase 12 regularity mismatch smoke test
        run: >-
          python scripts/analyze_phase12.py
          --tau-points 7
          --epsilon-points 7
          --output /tmp/phase12-summary.json
      - name: Phase 14 literature novelty-audit guardrail
        run: >-
          python scripts/validate_phase14_literature_audit.py
          --output /tmp/phase14/phase14_literature_audit_validation.json
      - name: Upload Phase 14 literature audit state
        uses: actions/upload-artifact@v4
        with:
          name: phase14-literature-audit-state
          path: /tmp/phase14
      - name: Phase 19 full-regularity publication figures
        run: >-
          python scripts/build_phase19_figures.py
          --points 31
          --output-dir /tmp/phase19-full-regularity
      - name: Upload Phase 19 full-regularity figures
        uses: actions/upload-artifact@v4
        with:
          name: phase19-full-regularity-figures
          path: /tmp/phase19-full-regularity
      - name: Phase 20 integrated paper asset build
        run: >-
          python scripts/build_paper_assets.py
          --output-dir /tmp/paper-assets
          --phase19-points 31
      - name: Upload Phase 20 integrated paper assets
        uses: actions/upload-artifact@v4
        with:
          name: phase20-paper-assets
          path: /tmp/paper-assets
      - name: Phase 20 MDPI submission package build
        run: >-
          python scripts/build_submission_package.py
          --output-dir /tmp/mdpi-submission-package
          --paper-assets-dir /tmp/paper-assets
      - name: Upload Phase 20 MDPI submission package
        uses: actions/upload-artifact@v4
        with:
          name: phase20-mdpi-submission-package
          path: /tmp/mdpi-submission-package
      - name: Phase 21 claim-to-evidence audit
        run: >-
          python scripts/audit_claim_registry.py
          --output-json /tmp/phase21/phase21_claim_audit.json
          --output-md /tmp/phase21/claim_evidence_matrix.md
      - name: Upload Phase 21 claim-evidence audit
        uses: actions/upload-artifact@v4
        with:
          name: phase21-claim-evidence-audit
          path: /tmp/phase21
      - name: Phase 10 manuscript scope lint
        run: >-
          python scripts/lint_manuscript_scope.py
          --output /tmp/phase10/manuscript_scope_lint.json
      - name: Assemble Phase 10 reviewer package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/phase10
          cp submission/reviewer_premortem.md /tmp/phase10/
          cp submission/novelty_statement.md /tmp/phase10/
          cp manuscript/terminology_guardrails.md /tmp/phase10/
          cp /tmp/phase21/claim_evidence_matrix.md /tmp/phase10/
      - name: Upload Phase 10 reviewer pre-mortem
        uses: actions/upload-artifact@v4
        with:
          name: phase10-reviewer-premortem
          path: /tmp/phase10
      - name: Hugging Face authentication check
        env:
          HF_TOKEN1: ${{ secrets.HF_TOKEN1 }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${HF_TOKEN1:-}" ]; then
            echo "HF_TOKEN1 is not available to this workflow."
            exit 1
          fi
          status=$(curl -sS -o /tmp/hf_whoami.json -w "%{http_code}" \
            -H "Authorization: Bearer ${HF_TOKEN1}" \
            https://huggingface.co/api/whoami-v2)
          if [ "$status" != "200" ]; then
            echo "Hugging Face authentication failed with HTTP ${status}."
            exit 1
          fi
          echo "Hugging Face authentication OK"
